apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-live-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-live-db
  template: # describe the pod template
    metadata:
      labels:
        app: devops-live-db
    spec:
      containers:
      - name: devops-live-db
        image: docker.io/library/postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "password"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        emptyDir: {}