apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-live
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: devops-live-api:1.0
          ports:
            - containerPort: 8000

          # Configuration comes from outside the image
          envFrom:
            - configMapRef:
                name: backend-config

          # Liveness -> "should Kubernetes RESTART this container?"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          # Readiness -> "should Kubernetes SEND TRAFFIC to this Pod?"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5

          # Requests -> used for scheduling. Limits -> the maximum allowed.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
