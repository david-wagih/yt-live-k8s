# Part 1 of the live: "It works on my laptop."
#   docker compose up --build
#   curl localhost:8000/tasks
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: supersecret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d tasks"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./app
      args:
        APP_VERSION: "1.0"
    image: devops-live-api:1.0
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: tasks
      DB_USER: devops
      DB_PASSWORD: supersecret
    depends_on:
      postgres:
        condition: service_healthy
