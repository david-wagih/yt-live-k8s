# Sensitive configuration.
# NOTE: Secrets are only base64-encoded, NOT encrypted. Never commit real
# secrets to git — in production use External Secrets / Vault / Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: devops-live
type: Opaque
stringData:
  DB_USER: devops
  DB_PASSWORD: supersecret
