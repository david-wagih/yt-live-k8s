# kind create cluster --name devops-live --config kind-config.yaml
#
# 1 control-plane + 2 workers. The control-plane is prepared for Ingress:
#   - label ingress-ready=true  -> the Ingress controller Pod is pinned to this node
#   - extraPortMappings         -> your laptop's 8081/8443 reach the node's 80/443
# (rootless Podman can't bind host ports < 1024, hence 8081/8443 instead of 80/443)
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
